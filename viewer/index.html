<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>帆船赛实时图</title>
<style>
  :root{
    --bg:#0b1116; --sea:#0e2b33; --line:#1d3a44; --ink:#dfeef2; --dim:#7f99a1;
    --boat:#ffd166; --mark:#5ad1a0; --wind:#6fb3ff; --pred:#ff7b6b; --stale:#5a6b70;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.45 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  /* 顶栏:桌面一行摆开;手机只留比赛名 + 状态,其余收进 ⚙ 面板 */
  #top{position:relative;flex:0 0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;border-bottom:1px solid var(--line);background:#0d151b;
    padding-top:calc(8px + env(safe-area-inset-top))}
  #top b{font-size:14px;font-weight:600;white-space:nowrap}
  #ctrls{display:contents}
  .pill{padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);
    font-size:12px;white-space:nowrap}
  .pill.run{color:#0b1116;background:#5ad1a0;border-color:#5ad1a0}
  .pill.wait{color:#0b1116;background:#ffd166;border-color:#ffd166}
  .pill.over{color:#0b1116;background:#7f99a1;border-color:#7f99a1}
  .pill.bad{color:#0b1116;background:#ff7b6b;border-color:#ff7b6b}
  select,button{background:#13212a;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;font:inherit;max-width:100%}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:hover,select:hover{border-color:#2b5664}
  button:active{background:#1a2e39}
  main{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #hud{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;max-width:calc(100% - 20px);
    font-size:12px;color:var(--dim);pointer-events:none}
  #hud .k{color:var(--ink)}
  #hud .hint{opacity:.7}
  #list{position:absolute;right:12px;top:12px;width:270px;max-height:calc(100% - 24px);
    overflow:auto;background:#0d151bcc;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #list h4{margin:2px 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .row{display:grid;grid-template-columns:10px 1fr auto auto;gap:6px;align-items:center;
    padding:3px 0;border-bottom:1px dashed #16282f;font-size:12px}
  .row:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:99px}
  .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{color:var(--dim);font-variant-numeric:tabular-nums}
  .row.stale{opacity:.45}
  #msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--dim);
    text-align:center;line-height:1.9;padding:0 20px}
  #bias{position:absolute;left:12px;top:12px;max-width:calc(100% - 320px);
    background:#0d151bcc;border:1px solid var(--line);border-radius:8px;padding:7px 11px;
    font-size:12px;color:var(--dim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    line-height:1.7}
  #bias b{color:var(--ink);font-weight:600}
  #bias .fav{color:#0b1116;background:#5ad1a0;border-radius:4px;padding:0 5px;font-weight:600}
  #bias .dn{color:#ffb4a8}
  #bias .sep{color:#2b5664;margin:0 6px}
  .grp{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
  .num{background:#13212a;color:var(--ink);border:1px solid var(--line);border-radius:6px;
    padding:3px 6px;font:inherit;width:62px;font-variant-numeric:tabular-nums;text-align:right}
  .num:focus{outline:0;border-color:#5ad1a0}
  .num::placeholder{color:#4d6b74}
  #listBtn,#cfgBtn{display:none}

  /* ---- 手机 / 窄窗口 ---- */
  @media (max-width:760px), (pointer:coarse){
    html,body{font-size:14px}
    #top{gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top))}
    #top b{flex:1 1 0;min-width:0;width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis}
    button,select{font-size:13px;padding:6px 9px;min-height:32px;border-radius:8px}
    .pill{font-size:11px;padding:2px 7px}
    #listBtn,#cfgBtn{display:inline-block;padding:5px 9px}
    /* 参数收进弹出面板,不占画布高度 */
    #ctrls{position:absolute;left:8px;right:8px;top:calc(100% + 4px);z-index:30;
      display:none;flex-wrap:wrap;gap:6px;align-items:center;
      background:#0d151bf2;border:1px solid var(--line);border-radius:10px;padding:8px;
      box-shadow:0 10px 30px #0008}
    #ctrls.open{display:flex}
    #ctrls select{flex:1 1 40%;max-width:46vw}
    .num{width:56px;padding:5px 5px;min-height:32px}
    /* 船表在手机上是底部浮层,默认收起,不挡图 */
    #list{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));
      max-height:44%;display:none;border-radius:10px}
    #list.open{display:block}
    .row{font-size:13px;padding:5px 0}
    #bias{left:8px;right:8px;top:8px;max-width:none;font-size:12px;padding:6px 9px;
      max-height:26%;overflow:auto}
    #hud{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));gap:10px;font-size:11px}
    #hud .hint{flex:1 1 100%;order:9}
  }
</style>
</head>
<body>
<div id="top">
  <b id="race">正在找比赛…</b>
  <span id="status" class="pill">—</span>
  <span class="pill" id="err" style="display:none"></span>
  <button id="listBtn">船表</button>
  <button id="cfgBtn">⚙</button>
  <span id="ctrls">
    <select id="sel"></select>
    <select id="round"></select>
    <button id="follow">自动框住:开</button>
    <button id="pred">预判线:开</button>
    <button id="lay">1标layline:开</button>
    <span class="grp" title="水流的去向:0 = 往北,90 = 往东,180 = 往南,270 = 往西">
      流
      <input id="curDir" class="num" type="number" min="0" max="359" step="5" placeholder="°" inputmode="numeric">
      <input id="curSpd" class="num" type="number" min="0" max="9" step="0.1" placeholder="0.0" inputmode="decimal">
      <span>kn</span>
    </span>
    <span class="pill" id="clock">—</span>
  </span>
</div>
<main>
  <canvas id="cv"></canvas>
  <div id="msg">连接中…</div>
  <div id="bias"></div>
  <div id="hud">
    <div><span class="k" id="windTxt">风 —</span></div>
    <div><span class="k" id="curTxt">流 —</span></div>
    <div><span class="k" id="layTxt">layline —</span></div>
    <div><span class="k" id="scaleTxt">—</span></div>
    <div class="hint" id="hint">滚轮缩放 · 拖动平移 · 双击复位</div>
  </div>
  <div id="list"><h4>船</h4><div id="boats"></div><h4 style="margin-top:10px">标</h4><div id="marks"></div></div>
</main>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/feed.js"></script>
<script src="js/calc.js"></script>
<script src="js/draw.js"></script>
<script src="js/interact.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
